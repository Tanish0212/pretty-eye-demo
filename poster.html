<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Counter poster · Pretty Eye Ladies Salon</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Nunito+Sans:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap">
  <style>
    /* Printable A5 counter poster. Print with "Margins: none" and "Background graphics" on.
       QR codes are static inline SVG, generated locally with segno (see README). */
    @page { size: A5 portrait; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #E9D4C4; font-family: "Nunito Sans", Arial, sans-serif; color: #4E2440; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 20px 16px 0; }
    .toolbar button { font: 500 15px "Nunito Sans", Arial, sans-serif; padding: 0 24px; min-height: 44px; border: 0; border-radius: 999px; background: #B04A2F; color: #fff; cursor: pointer; }
    .toolbar a { font: 500 15px "Nunito Sans", Arial, sans-serif; color: #B04A2F; align-self: center; min-height: 44px; display: inline-flex; align-items: center; }
    .sheet {
      width: 148mm; height: 210mm; margin: 20px auto 40px; background: #FFF6EC;
      padding: 13mm 13mm 11mm; display: flex; flex-direction: column; align-items: center; text-align: center;
      position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.18); overflow: hidden;
      font-variant-numeric: lining-nums;
    }
    .logo { width: 19mm; height: 19mm; position: relative; }
    .name { margin: 3.5mm 0 0; font: italic 400 15mm/1 "Instrument Serif", Georgia, serif; position: relative; }
    .sub { margin: 2.2mm 0 0; font: 500 2.7mm "Nunito Sans", Arial, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #B04A2F; position: relative; }
    .ar-name { margin: 1.6mm 0 0; font: 600 4mm/1.4 "Tajawal", sans-serif; color: #B04A2F; position: relative; }
    .rule { width: 18mm; height: 0; border-top: 0.35mm solid #B04A2F; margin: 4.5mm 0 4mm; position: relative; }
    .cta { margin: 0; font: italic 400 7mm/1.15 "Instrument Serif", Georgia, serif; color: #B04A2F; position: relative; }
    .cta-ar { margin: 1.6mm 0 0; font: 500 4mm/1.45 "Tajawal", sans-serif; color: #6E5560; position: relative; }
    .qr-box { margin-top: 4.5mm; padding: 2.5mm; background: #fff; border: 0.3mm solid #EBD5C3; border-radius: 1.5mm; position: relative; }
    .qr { display: block; width: 54mm; height: 54mm; }
    .phone { margin: 4.5mm 0 0; font: 500 8.4mm/1 "Nunito Sans", Arial, sans-serif; letter-spacing: .02em; font-variant-numeric: lining-nums tabular-nums; position: relative; }
    .phone-label { margin: 1.6mm 0 0; font: 500 2.6mm "Nunito Sans", Arial, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #B04A2F; position: relative; }
    .foot {
      margin-top: auto; width: 100%; display: flex; align-items: center; gap: 4mm; text-align: start;
      padding-top: 3.5mm; border-top: 0.25mm solid #EBD5C3; position: relative;
    }
    .qr-small { display: block; width: 19mm; height: 19mm; flex: none; background: #fff; padding: 1.2mm; box-sizing: content-box; border: 0.25mm solid #EBD5C3; }
    .foot p { margin: 0; font: 400 2.85mm/1.45 "Nunito Sans", Arial, sans-serif; color: #6E5560; }
    .foot b { font-weight: 600; color: #4E2440; }
    .sheet::before { content: ''; position: absolute; width: 150mm; height: 150mm; border-radius: 50%; background: #F8D9C4; top: -88mm; left: -1mm; }
    .qr-box { border-radius: 4mm; border: .5mm solid #4E2440; box-shadow: 2mm 2mm 0 #4E2440; }
    .ar-name { font-weight: 700; }
    .foot { border-top: .4mm dotted #B04A2F; }
    @media print {
      body { background: none; }
      .toolbar { display: none; }
      .sheet { margin: 0; box-shadow: none; }
    }
    @media screen and (max-width: 600px) {
      .sheet { zoom: .62; }
    }
  </style>
</head>
